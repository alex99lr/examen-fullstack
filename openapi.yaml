openapi: 3.0.3
info:
  title: API Examen Fullstack
  description: >
    Servicio de estudiantes (publico), autenticacion con JWT y
    CRUD de usuarios (protegido con token).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor local
tags:
  - name: Estudiantes
    description: Listado de estudiantes
  - name: Auth
    description: Inicio de sesion
  - name: Usuarios
    description: CRUD de usuarios (requiere token JWT)

paths:
  /estudiantes:
    get:
      tags: [Estudiantes]
      summary: Lista de estudiantes
      description: Devuelve el codigo de estatus, un mensaje y el listado de estudiantes.
      responses:
        '200':
          description: Listado de estudiantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEstudiantes'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      description: Valida correo y contrasena y devuelve un token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          description: Token ausente o invalido
    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: La contrasena se guarda cifrada con BCrypt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '200':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Token ausente o invalido

  /usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del usuario
        schema:
          type: integer
          format: int64
    get:
      tags: [Usuarios]
      summary: Obtener un usuario por id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Token ausente o invalido
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Usuarios]
      summary: Actualizar un usuario
      description: Si no se envia contrasena, se conserva la actual.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Token ausente o invalido
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Usuario eliminado
        '401':
          description: Token ausente o invalido
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      required: [nombre, email, password]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nombre:
          type: string
          example: Ana Maria
        email:
          type: string
          format: email
          example: ana@correo.com
        password:
          type: string
          format: password
          writeOnly: true
          example: '123456'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ana@correo.com
        password:
          type: string
          format: password
          example: '123456'

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT para el encabezado Authorization
          example: eyJhbGciOiJIUzI1NiJ9...

    Direccion:
      type: object
      properties:
        calle:
          type: string
          example: Maravillas
        colonia:
          type: string
          example: Benito Juarez
        ciudad:
          type: string
          example: Mexico

    Estudiante:
      type: object
      properties:
        numeroControl:
          type: integer
          example: 100799
        nombre:
          type: string
          example: Alex Lopez
        email:
          type: string
          example: lopezalex@gmail.com
        direccion:
          $ref: '#/components/schemas/Direccion'
        telefono:
          type: string
          example: '5644122023'

    RespuestaEstudiantes:
      type: object
      properties:
        status:
          type: integer
          description: Codigo de estatus de la respuesta
          example: 200
        mensaje:
          type: string
          description: Descripcion del codigo de estatus
          example: OK
        estudiantes:
          type: array
          items:
            $ref: '#/components/schemas/Estudiante'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        path:
          type: string
          example: /usuarios/99